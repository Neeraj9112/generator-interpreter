<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pip</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
  <span class="brand">pip</span>
  <span class="rule"></span>
  <nav class="controls">
    <button id="back"><span class="key">b</span>ack</button>
    <button id="step"><span class="key">s</span>tep</button>
    <button id="step-line"><span class="key">l</span>ine</button>
    <button id="step-over"><span class="key">o</span>ver</button>
    <button id="run" class="go"><span class="key">r</span>un</button>
    <button id="reset" class="quiet">r<span class="key">e</span>set</button>
    <button id="edit" class="quiet">edit</button>
  </nav>
  <span class="rule"></span>
  <nav class="backend" id="backend" aria-label="execution backend">
    <button class="tab" data-backend="tree">tree</button>
    <button class="tab" data-backend="vm">vm</button>
  </nav>
  <span id="status" class="status">ready</span>
</header>

<section class="ribbon">
  <canvas id="ribbon" height="56" title="click a column to step back to it"></canvas>
  <div class="ribbon-foot">
    <span class="legend"><i class="swatch enter"></i>enter <i class="swatch exit"></i>exit <i class="swatch stop"></i>breakpoint</span>
    <span id="ribbon-count" class="legend"></span>
  </div>
</section>

<p id="failure" class="failure" hidden></p>

<main>
  <section class="source-pane">
    <h2>source <small>click a line number to break</small></h2>
    <div id="source" class="source"></div>
    <textarea id="editor" class="editor" spellcheck="false" hidden>fn makeCounter() {
  let n = 0
  fn inc() {
    n = n + 1
    return n
  }
  return inc
}

let a = makeCounter()
let b = makeCounter()

print(a())
print(a())
print(b())
</textarea>
  </section>

  <section class="code-pane" id="code-pane" hidden>
    <h2>instructions <small id="code-title"></small></h2>
    <div id="code" class="code-list"></div>
  </section>

  <aside>
    <section>
      <h2>
        scopes <small>innermost first</small>
        <label class="toggle"><input type="checkbox" id="show-empty"> empty</label>
      </h2>
      <div id="scopes" class="scopes"></div>
    </section>
    <section>
      <h2>stack</h2>
      <div id="stack" class="stack"></div>
    </section>
    <section id="heap-pane" hidden>
      <h2>
        heap <small id="heap-count"></small>
        <span class="gc-controls">
          <button id="gc-step" class="tiny">collect</button>
          <button id="gc-finish" class="tiny quiet" hidden>finish</button>
        </span>
      </h2>
      <div id="heap" class="heap"></div>
      <div class="legend heap-legend">
        <i class="swatch cell-str"></i>string
        <i class="swatch cell-fn"></i>fn
        <i class="swatch cell-env"></i>scope
        <i class="swatch cell-fn cell-pinned"></i>pinned
        <i class="swatch cell-env cell-history"></i>held by history
        <i class="swatch cell-grey"></i>grey
        <i class="swatch cell-black"></i>black
      </div>
    </section>
    <section>
      <h2>output <small>print</small></h2>
      <pre id="output" class="output"></pre>
    </section>
  </aside>
</main>

<script type="module" src="./ui.js"></script>
</body>
</html>
